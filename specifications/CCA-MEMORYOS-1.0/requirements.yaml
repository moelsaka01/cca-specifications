metadata:
  specification_id: CCA-MEMORYOS-1.0
  title: MemoryOS Standard
  version: "1.0"
  publication: published
  publication_date: "2026-09-05"
  milestone: MO-1208
  scope: Deterministic MemoryOS platform behavior and conformance
  normative_requirement_count: 114

incorporated_requirements:
  - specification_id: CCA-RF-1.0
    first_id: CCA-RF-001
    last_id: CCA-RF-040
    count: 40
    requirements_registry_sha256: c1505f5b2b0cf69865a605d60a94279bcf73fa57310bedfcd29102f7f9830aa8
    incorporation: normative
    evidence_groups: [MOS-EVID-RT-001]
  - specification_id: CCA-MIP-1.0
    first_id: CCA-MIP-001
    last_id: CCA-MIP-064
    count: 64
    requirements_registry_sha256: 4238525e7936376d7ea057c31266dd39c6379da471b4a6e7b09c6bee78e738af
    incorporation: normative
    evidence_groups: [MOS-EVID-MIP-001]

evidence_groups:
  MOS-EVID-RT-001: Runtime observation boundary and CCA-RF incorporation
  MOS-EVID-LIFE-001: Investigation lifecycle, exact transition payloads, identities, and log integrity
  MOS-EVID-MIP-001: MIP integration and CCA-MIP incorporation
  MOS-EVID-ADAPT-001: Adapter descriptor, request, snapshot, projection, package, artifact, and failure contract
  MOS-EVID-CORE-001: Core operations, identity, phase, availability, isolation, and failure behavior
  MOS-EVID-ART-001: Native profile, Frame, artifact reconstruction, identity, ordering, validation, and control state
  MOS-EVID-SDK-001: SDK complete Investigation projection, ownership, operation, and binding parity
  MOS-EVID-CLI-001: CLI grammar, aliases, result shapes, streams, exits, and automation behavior
  MOS-EVID-REG-001: Cognitive Regression behavior
  MOS-EVID-EXPL-001: Investigation Explorer navigation and detached structural validation behavior
  MOS-EVID-CONF-001: Conformance report integrity
  MOS-EVID-COMP-001: Compatibility behavior
  MOS-EVID-VER-001: Version identity and change control

conformance_profiles:
  applicability: union_of_common_and_selected_profile_evidence_groups
  common_evidence_groups: [MOS-EVID-COMP-001, MOS-EVID-CONF-001, MOS-EVID-VER-001]
  profiles:
    - name: AI Runtime Adapter
      evidence_groups: [MOS-EVID-ADAPT-001]
    - name: CLI
      evidence_groups: [MOS-EVID-CLI-001]
    - name: Cognitive Investigation Explorer
      evidence_groups: [MOS-EVID-EXPL-001]
    - name: Cognitive Regression
      evidence_groups: [MOS-EVID-REG-001]
    - name: Investigation Core
      evidence_groups: [MOS-EVID-CORE-001, MOS-EVID-LIFE-001]
    - name: MIP Integration
      evidence_groups: [MOS-EVID-MIP-001]
    - name: Native Investigation Artifacts
      evidence_groups: [MOS-EVID-ART-001]
    - name: Runtime Observation Boundary
      evidence_groups: [MOS-EVID-RT-001]
    - name: SDK
      evidence_groups: [MOS-EVID-SDK-001]

requirements:
  - id: CCA-MOS-RT-001
    title: Runtime Foundation incorporation
    requirement: A conforming MemoryOS platform MUST satisfy applicable CCA-RF-001 through CCA-RF-040 from the incorporated CCA-RF-1.0 publication.
    priority: mandatory
    stability: frozen
    source: "runtime-behavior.md § CCA-MOS-RT-001"
    verification: [{method: conformance_suite, evidence: MOS-EVID-RT-001}]
    evidence_groups: [MOS-EVID-RT-001]
    implementation_milestone: MO-1208
    status: approved
    adr: []
  - id: CCA-MOS-RT-002
    title: Runtime source authority
    requirement: MemoryOS MUST treat the source Runtime as the authority for observed cognition and MUST NOT replace, reinterpret, or own that source truth.
    priority: mandatory
    stability: frozen
    source: "runtime-behavior.md § CCA-MOS-RT-002"
    verification: [{method: architecture_review, evidence: MOS-EVID-RT-001}]
    evidence_groups: [MOS-EVID-RT-001]
    implementation_milestone: MO-1208
    status: approved
    adr: []
  - id: CCA-MOS-RT-003
    title: Settled Observation acceptance
    requirement: MemoryOS MUST publish as accepted cognition only a coherent, detached, immutable native Observation Frame whose outer resultCode is OK, or a verified MIP Observation, and MUST NOT publish an outer non-OK, incomplete, partial, or invalidly projected source result; nested cca-studio-native-observation result and session state fields are preserved source data and are not acceptance gates.
    priority: mandatory
    stability: frozen
    source: "runtime-behavior.md § CCA-MOS-RT-003"
    verification: [{method: negative_test, evidence: MOS-EVID-RT-001}]
    evidence_groups: [MOS-EVID-RT-001]
    implementation_milestone: MO-1208
    status: approved
    adr: []
  - id: CCA-MOS-RT-004
    title: Deterministic Runtime boundary
    requirement: Equivalent accepted cognition, explicit input, Workspace identity, and initial state MUST produce equivalent boundary outcomes.
    priority: mandatory
    stability: frozen
    source: "runtime-behavior.md § CCA-MOS-RT-004"
    verification: [{method: deterministic_repeat_test, evidence: MOS-EVID-RT-001}]
    evidence_groups: [MOS-EVID-RT-001]
    implementation_milestone: MO-1208
    status: approved
    adr: []
  - id: CCA-MOS-RT-005
    title: Workspace isolation
    requirement: Every Observation MUST retain exact Workspace identity and cross-Workspace values MUST be rejected without changing either Workspace or accepted investigation state.
    priority: mandatory
    stability: frozen
    source: "runtime-behavior.md § CCA-MOS-RT-005"
    verification: [{method: isolation_test, evidence: MOS-EVID-RT-001}]
    evidence_groups: [MOS-EVID-RT-001]
    implementation_milestone: MO-1208
    status: approved
    adr: []
  - id: CCA-MOS-RT-006
    title: Runtime and presentation independence
    requirement: Investigation after Observation acceptance MUST NOT require a live source Runtime or presentation and neither may alter accepted cognition.
    priority: mandatory
    stability: frozen
    source: "runtime-behavior.md § CCA-MOS-RT-006"
    verification: [{method: dependency_boundary_test, evidence: MOS-EVID-RT-001}]
    evidence_groups: [MOS-EVID-RT-001]
    implementation_milestone: MO-1208
    status: approved
    adr: []

  - id: CCA-MOS-LIFE-001
    title: Closed lifecycle state set
    requirement: An Investigation MUST expose exactly Created, Observed, Traced, ReplayReady, Replaying, ReplayComplete, ComparisonReady, Comparing, Verified, and Archived as lifecycle states.
    priority: mandatory
    stability: frozen
    source: "investigation-lifecycle.md § CCA-MOS-LIFE-001"
    verification: [{method: lifecycle_test, evidence: MOS-EVID-LIFE-001}]
    evidence_groups: [MOS-EVID-LIFE-001]
    implementation_milestone: MO-1208
    status: approved
    adr: []
  - id: CCA-MOS-LIFE-002
    title: Closed lifecycle transitions
    requirement: Lifecycle changes MUST follow the published transition table and undefined or precondition-failing transitions MUST be rejected deterministically.
    priority: mandatory
    stability: frozen
    source: "investigation-lifecycle.md § CCA-MOS-LIFE-002"
    verification: [{method: transition_matrix_test, evidence: MOS-EVID-LIFE-001}]
    evidence_groups: [MOS-EVID-LIFE-001]
    implementation_milestone: MO-1208
    status: approved
    adr: []
  - id: CCA-MOS-LIFE-003
    title: Authoritative transition log
    requirement: Core-generated investigation history MUST use the exact closed transition and log shapes, transition-kind set, payload forms, append-only contiguous indices, prefix-digest chain, domain-separated identities, and final log digest published by the lifecycle contract.
    priority: mandatory
    stability: frozen
    source: "investigation-lifecycle.md § CCA-MOS-LIFE-003"
    verification: [{method: integrity_test, evidence: MOS-EVID-LIFE-001}]
    evidence_groups: [MOS-EVID-LIFE-001]
    implementation_milestone: MO-1208
    status: approved
    adr: []
  - id: CCA-MOS-LIFE-004
    title: Atomic state derivation
    requirement: Every state-changing command MUST re-derive complete candidate state from transition zero and publish only after success, leaving prior state unchanged on failure.
    priority: mandatory
    stability: frozen
    source: "investigation-lifecycle.md § CCA-MOS-LIFE-004"
    verification: [{method: atomic_failure_test, evidence: MOS-EVID-LIFE-001}]
    evidence_groups: [MOS-EVID-LIFE-001]
    implementation_milestone: MO-1208
    status: approved
    adr: []
  - id: CCA-MOS-LIFE-005
    title: Atomic Trace and Replay preparation
    requirement: Trace selection MUST resolve one exact Reflection or authored Trace and atomically prepare its Replay; a later native Observation MUST rebuild that target against the new Frame or publish Observed with the defined diagnostic and no stale artifact.
    priority: mandatory
    stability: frozen
    source: "investigation-lifecycle.md § CCA-MOS-LIFE-005"
    verification: [{method: trace_replay_test, evidence: MOS-EVID-LIFE-001}]
    evidence_groups: [MOS-EVID-LIFE-001]
    implementation_milestone: MO-1208
    status: approved
    adr: []
  - id: CCA-MOS-LIFE-006
    title: Replay action set and no-op
    requirement: Replay MUST support only play, pause, restart, previous, next, and advance, and an action with no state change MUST NOT append a transition.
    priority: mandatory
    stability: frozen
    source: "investigation-lifecycle.md § CCA-MOS-LIFE-006"
    verification: [{method: replay_state_test, evidence: MOS-EVID-LIFE-001}]
    evidence_groups: [MOS-EVID-LIFE-001]
    implementation_milestone: MO-1208
    status: approved
    adr: []
  - id: CCA-MOS-LIFE-007
    title: Comparison flow and restoration
    requirement: Comparison MUST require completed Replay and two Observations, enter Evolution before Comparative Reconstruction, and restore the bound Replay state when leaving Evolution.
    priority: mandatory
    stability: frozen
    source: "investigation-lifecycle.md § CCA-MOS-LIFE-007"
    verification: [{method: comparison_lifecycle_test, evidence: MOS-EVID-LIFE-001}]
    evidence_groups: [MOS-EVID-LIFE-001]
    implementation_milestone: MO-1208
    status: approved
    adr: []
  - id: CCA-MOS-LIFE-008
    title: Point-in-time verification
    requirement: Verification MUST validate complete current state; later mutation MUST invalidate it and immediate archival MUST preserve it.
    priority: mandatory
    stability: frozen
    source: "investigation-lifecycle.md § CCA-MOS-LIFE-008"
    verification: [{method: verification_lifecycle_test, evidence: MOS-EVID-LIFE-001}]
    evidence_groups: [MOS-EVID-LIFE-001]
    implementation_milestone: MO-1208
    status: approved
    adr: []
  - id: CCA-MOS-LIFE-009
    title: Terminal archive
    requirement: Archived MUST be terminal for mutation while remaining loadable and checkpointable.
    priority: mandatory
    stability: frozen
    source: "investigation-lifecycle.md § CCA-MOS-LIFE-009"
    verification: [{method: archive_test, evidence: MOS-EVID-LIFE-001}]
    evidence_groups: [MOS-EVID-LIFE-001]
    implementation_milestone: MO-1208
    status: approved
    adr: []
  - id: CCA-MOS-LIFE-010
    title: Return-to-world behavior
    requirement: Return-to-world MUST clear active investigation artifacts without changing accepted Observations and MUST expose Observed or Created as applicable.
    priority: mandatory
    stability: frozen
    source: "investigation-lifecycle.md § CCA-MOS-LIFE-010"
    verification: [{method: lifecycle_test, evidence: MOS-EVID-LIFE-001}]
    evidence_groups: [MOS-EVID-LIFE-001]
    implementation_milestone: MO-1208
    status: approved
    adr: []
  - id: CCA-MOS-LIFE-011
    title: Integrity-bound checkpoint restoration
    requirement: A checkpoint MUST bind its Investigation, Workspace, log, log digest, transition count, and state digest, and invalid or conflicting restoration MUST fail atomically.
    priority: mandatory
    stability: frozen
    source: "investigation-lifecycle.md § CCA-MOS-LIFE-011"
    verification: [{method: checkpoint_test, evidence: MOS-EVID-LIFE-001}]
    evidence_groups: [MOS-EVID-LIFE-001]
    implementation_milestone: MO-1208
    status: approved
    adr: []
  - id: CCA-MOS-LIFE-012
    title: Source-authored MIP capability availability
    requirement: A MIP-backed Investigation MUST expose derived capabilities only when corresponding validated source-authored artifacts exist, preserving Observation-only packages.
    priority: mandatory
    stability: frozen
    source: "investigation-lifecycle.md § CCA-MOS-LIFE-012"
    verification: [{method: package_capability_test, evidence: MOS-EVID-LIFE-001}]
    evidence_groups: [MOS-EVID-LIFE-001]
    implementation_milestone: MO-1208
    status: approved
    adr: []

  - id: CCA-MOS-MIP-001
    title: Complete MIP requirement incorporation
    requirement: Every MIP operation MUST satisfy applicable CCA-MIP-001 through CCA-MIP-064 from the exact incorporated publication.
    priority: mandatory
    stability: frozen
    source: "mip-contract.md § CCA-MOS-MIP-001"
    verification: [{method: mip_conformance_suite, evidence: MOS-EVID-MIP-001}]
    evidence_groups: [MOS-EVID-MIP-001]
    implementation_milestone: MO-1208
    status: approved
    adr: []
  - id: CCA-MOS-MIP-002
    title: Baseline export identity
    requirement: Baseline export MUST use CCA-MIP format 1.0.0 and its exact profiles while import and round-trip preserve incorporated same-major compatibility.
    priority: mandatory
    stability: frozen
    source: "mip-contract.md § CCA-MOS-MIP-002"
    verification: [{method: format_and_compatibility_test, evidence: MOS-EVID-MIP-001}]
    evidence_groups: [MOS-EVID-MIP-001]
    implementation_milestone: MO-1208
    status: approved
    adr: []
  - id: CCA-MOS-MIP-003
    title: Strict atomic MIP import
    requirement: Import and verification MUST treat bytes as untrusted, perform the complete MIP contract, publish only a valid immutable package, and leave state unchanged on failure.
    priority: mandatory
    stability: frozen
    source: "mip-contract.md § CCA-MOS-MIP-003"
    verification: [{method: import_negative_suite, evidence: MOS-EVID-MIP-001}]
    evidence_groups: [MOS-EVID-MIP-001]
    implementation_milestone: MO-1208
    status: approved
    adr: []
  - id: CCA-MOS-MIP-004
    title: Exact authored MIP export
    requirement: Export MUST return canonical bytes for an existing verified MIP-backed Investigation and MUST NOT manufacture native-to-MIP cognition or missing package data.
    priority: mandatory
    stability: frozen
    source: "mip-contract.md § CCA-MOS-MIP-004"
    verification: [{method: export_boundary_test, evidence: MOS-EVID-MIP-001}]
    evidence_groups: [MOS-EVID-MIP-001]
    implementation_milestone: MO-1208
    status: approved
    adr: []
  - id: CCA-MOS-MIP-005
    title: Single portable package semantics
    requirement: An implementation MUST NOT introduce competing portable package semantics or implementation-specific repair, ordering, hashing, or presentation behavior.
    priority: mandatory
    stability: frozen
    source: "mip-contract.md § CCA-MOS-MIP-005"
    verification: [{method: architecture_review, evidence: MOS-EVID-MIP-001}]
    evidence_groups: [MOS-EVID-MIP-001]
    implementation_milestone: MO-1208
    status: approved
    adr: []

  - id: CCA-MOS-ADAPT-001
    title: Provider-independent adapter contract
    requirement: An adapter MUST implement contract version 1.0.0 with the exact provider-independent descriptor, definition, producer identity, attestation, and three-operation semantics without making a provider SDK part of the Standard.
    priority: mandatory
    stability: frozen
    source: "adapter-contract.md § CCA-MOS-ADAPT-001"
    verification: [{method: dependency_review, evidence: MOS-EVID-ADAPT-001}]
    evidence_groups: [MOS-EVID-ADAPT-001]
    implementation_milestone: MO-1208
    status: approved
    adr: []
  - id: CCA-MOS-ADAPT-002
    title: External Runtime ownership
    requirement: The external Runtime MUST retain execution and cognition ownership and an adapter MUST NOT start, control, retry, modify, or own it.
    priority: mandatory
    stability: frozen
    source: "adapter-contract.md § CCA-MOS-ADAPT-002"
    verification: [{method: architecture_review, evidence: MOS-EVID-ADAPT-001}]
    evidence_groups: [MOS-EVID-ADAPT-001]
    implementation_milestone: MO-1208
    status: approved
    adr: []
  - id: CCA-MOS-ADAPT-003
    title: Settled source requirement
    requirement: An adapter MUST publish only after complete explicit success and MUST fail closed for empty, failed, cancelled, interrupted, incomplete, ambiguous, or unsupported outcomes.
    priority: mandatory
    stability: frozen
    source: "adapter-contract.md § CCA-MOS-ADAPT-003"
    verification: [{method: lifecycle_negative_test, evidence: MOS-EVID-ADAPT-001}]
    evidence_groups: [MOS-EVID-ADAPT-001]
    implementation_milestone: MO-1208
    status: approved
    adr: []
  - id: CCA-MOS-ADAPT-004
    title: Explicit deterministic adapter request
    requirement: An adapter MUST accept only the closed request, required identities, exact defaults, and numeric constraints, and MUST NOT derive required inputs from ambient nondeterministic state.
    priority: mandatory
    stability: frozen
    source: "adapter-contract.md § CCA-MOS-ADAPT-004"
    verification: [{method: deterministic_input_test, evidence: MOS-EVID-ADAPT-001}]
    evidence_groups: [MOS-EVID-ADAPT-001]
    implementation_milestone: MO-1208
    status: approved
    adr: []
  - id: CCA-MOS-ADAPT-005
    title: Source-authorship attestation
    requirement: An adapter definition MUST include explicit source-authorship attestation before a source value may enter package cognition.
    priority: mandatory
    stability: frozen
    source: "adapter-contract.md § CCA-MOS-ADAPT-005"
    verification: [{method: contract_test, evidence: MOS-EVID-ADAPT-001}]
    evidence_groups: [MOS-EVID-ADAPT-001]
    implementation_milestone: MO-1208
    status: approved
    adr: []
  - id: CCA-MOS-ADAPT-006
    title: Context-only truth-preserving projection
    requirement: The completed projection MUST use the exact closed projection and record shapes, strict source order, occurrence rule, and context mapping, preserve source identity and revision with empty provenance, and MUST NOT infer roles or causality.
    priority: mandatory
    stability: frozen
    source: "adapter-contract.md § CCA-MOS-ADAPT-006"
    verification: [{method: semantic_boundary_test, evidence: MOS-EVID-ADAPT-001}]
    evidence_groups: [MOS-EVID-ADAPT-001]
    implementation_milestone: MO-1208
    status: approved
    adr: []
  - id: CCA-MOS-ADAPT-007
    title: Observation-only MIP output
    requirement: Adapter output MUST be the exact verified Observation-only MIP, canonical bytes, or artifact envelope requested, with empty derived sections and no transport, timing, usage, provider configuration, raw envelope, or SDK state.
    priority: mandatory
    stability: frozen
    source: "adapter-contract.md § CCA-MOS-ADAPT-007"
    verification: [{method: package_inspection_test, evidence: MOS-EVID-ADAPT-001}]
    evidence_groups: [MOS-EVID-ADAPT-001]
    implementation_milestone: MO-1208
    status: approved
    adr: []
  - id: CCA-MOS-ADAPT-008
    title: Deterministic atomic adapter output
    requirement: Equivalent settled cognition and requests MUST produce byte-identical packages independent of chunking; exact snapshot depth, value, UTF-16-unit, UTF-8-byte, event, and package bounds MUST be enforced; and failure MUST publish no partial output.
    priority: mandatory
    stability: frozen
    source: "adapter-contract.md § CCA-MOS-ADAPT-008"
    verification: [{method: deterministic_atomicity_test, evidence: MOS-EVID-ADAPT-001}]
    evidence_groups: [MOS-EVID-ADAPT-001]
    implementation_milestone: MO-1208
    status: approved
    adr: []
  - id: CCA-MOS-ADAPT-009
    title: Stable adapter diagnostics
    requirement: Adapter failures MUST use the closed adapter code set and MIP failures MUST retain MIP diagnostics.
    priority: mandatory
    stability: frozen
    source: "adapter-contract.md § CCA-MOS-ADAPT-009"
    verification: [{method: diagnostic_test, evidence: MOS-EVID-ADAPT-001}]
    evidence_groups: [MOS-EVID-ADAPT-001]
    implementation_milestone: MO-1208
    status: approved
    adr: []

  - id: CCA-MOS-CORE-001
    title: Single Investigation Core authority
    requirement: The Investigation Core MUST be the only investigation lifecycle, Trace, Replay, Evolution, Comparative, Regression, and Explorer execution implementation used by platform clients.
    priority: mandatory
    stability: frozen
    source: "investigation-core.md § CCA-MOS-CORE-001"
    verification: [{method: architecture_review, evidence: MOS-EVID-CORE-001}]
    evidence_groups: [MOS-EVID-CORE-001]
    implementation_milestone: MO-1208
    status: approved
    adr: []
  - id: CCA-MOS-CORE-002
    title: Isolated Core ownership
    requirement: One Core instance MUST own isolated state and every Investigation MUST retain one exact Workspace and source kind for its lifetime.
    priority: mandatory
    stability: frozen
    source: "investigation-core.md § CCA-MOS-CORE-002"
    verification: [{method: isolation_test, evidence: MOS-EVID-CORE-001}]
    evidence_groups: [MOS-EVID-CORE-001]
    implementation_milestone: MO-1208
    status: approved
    adr: []
  - id: CCA-MOS-CORE-003
    title: Closed Core operations
    requirement: The Core MUST implement the complete operation and action sets, both create forms, exact default Investigation identity, direct-Core MIP and native selection fallbacks, and normative investigation lifecycle.
    priority: mandatory
    stability: frozen
    source: "investigation-core.md § CCA-MOS-CORE-003"
    verification: [{method: operation_matrix_test, evidence: MOS-EVID-CORE-001}]
    evidence_groups: [MOS-EVID-CORE-001]
    implementation_milestone: MO-1208
    status: approved
    adr: []
  - id: CCA-MOS-CORE-004
    title: Immutable canonical Core values
    requirement: The Core MUST canonical-clone input, publish recursively immutable values, publish successful Verification Session and public Core Checkpoint values with their exact defined members and content-derived identities, and MUST NOT expose mutable internal state as authority.
    priority: mandatory
    stability: frozen
    source: "investigation-core.md § CCA-MOS-CORE-004"
    verification: [{method: immutability_test, evidence: MOS-EVID-CORE-001}]
    evidence_groups: [MOS-EVID-CORE-001]
    implementation_milestone: MO-1208
    status: approved
    adr: []
  - id: CCA-MOS-CORE-005
    title: Native derivation fidelity
    requirement: Native cognition MUST derive and validate Trace, Replay, Evolution, Comparative Reconstruction, and their control states exactly as defined by native-artifacts.md and preserve the specified kind and version identities.
    priority: mandatory
    stability: frozen
    source: "investigation-core.md § CCA-MOS-CORE-005"
    verification: [{method: native_artifact_test, evidence: MOS-EVID-CORE-001}]
    evidence_groups: [MOS-EVID-CORE-001]
    implementation_milestone: MO-1208
    status: approved
    adr: []
  - id: CCA-MOS-CORE-006
    title: MIP authorship fidelity
    requirement: MIP-backed investigations MUST expose only verified source-authored artifacts and MUST NOT synthesize missing capability or relabel partial package values as native artifacts.
    priority: mandatory
    stability: frozen
    source: "investigation-core.md § CCA-MOS-CORE-006"
    verification: [{method: package_source_test, evidence: MOS-EVID-CORE-001}]
    evidence_groups: [MOS-EVID-CORE-001]
    implementation_milestone: MO-1208
    status: approved
    adr: []
  - id: CCA-MOS-CORE-007
    title: Core package boundary
    requirement: Core package operations MUST delegate MIP meaning to CCA-MIP-1.0 and native export without authored MIP MUST fail rather than synthesize cognition.
    priority: mandatory
    stability: frozen
    source: "investigation-core.md § CCA-MOS-CORE-007"
    verification: [{method: package_boundary_test, evidence: MOS-EVID-CORE-001}]
    evidence_groups: [MOS-EVID-CORE-001]
    implementation_milestone: MO-1208
    status: approved
    adr: []
  - id: CCA-MOS-CORE-008
    title: Read-only Regression and Explorer
    requirement: Regression and Explorer MUST append no transition, change no lifecycle, and modify no Investigation.
    priority: mandatory
    stability: frozen
    source: "investigation-core.md § CCA-MOS-CORE-008"
    verification: [{method: read_only_test, evidence: MOS-EVID-CORE-001}]
    evidence_groups: [MOS-EVID-CORE-001]
    implementation_milestone: MO-1208
    status: approved
    adr: []
  - id: CCA-MOS-CORE-009
    title: Renderer-independent Core
    requirement: The Core MUST project the exact 22-member complete immutable Investigation value with the defined phase precedence and closed availability keys and conditions without depending on renderer, camera, pixels, route, or presentation cache.
    priority: mandatory
    stability: frozen
    source: "investigation-core.md § CCA-MOS-CORE-009"
    verification: [{method: dependency_boundary_test, evidence: MOS-EVID-CORE-001}]
    evidence_groups: [MOS-EVID-CORE-001]
    implementation_milestone: MO-1208
    status: approved
    adr: []
  - id: CCA-MOS-CORE-010
    title: Ambient-state independence
    requirement: Core semantic results MUST NOT depend on randomness, clocks, timers, polling, network, Provider SDKs, filesystem enumeration, or mutable global state.
    priority: mandatory
    stability: frozen
    source: "investigation-core.md § CCA-MOS-CORE-010"
    verification: [{method: deterministic_repeat_test, evidence: MOS-EVID-CORE-001}]
    evidence_groups: [MOS-EVID-CORE-001]
    implementation_milestone: MO-1208
    status: approved
    adr: []
  - id: CCA-MOS-CORE-011
    title: Core resource bounds
    requirement: The Core MUST reject more than 10000 transitions or a transition payload whose exact JCS canonical form exceeds 16 * 1024 * 1024 UTF-8 bytes before publication with RESOURCE_LIMIT_EXCEEDED.
    priority: mandatory
    stability: frozen
    source: "investigation-core.md § CCA-MOS-CORE-011"
