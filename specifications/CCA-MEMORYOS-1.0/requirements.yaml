  - id: CCA-MOS-COMP-001
    title: Observable behavioral compatibility
    requirement: Behavioral compatibility MUST be based on equivalent standard-defined outcomes and MUST NOT be established by implementation, renderer, layout, timing, or pixel similarity.
    priority: mandatory
    stability: frozen
    source: "compatibility.md § CCA-MOS-COMP-001"
